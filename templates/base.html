<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fitness Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ─── Theme Variables ─── */
        :root {
            /* Dark mode (default) */
            --bg-body: #0f0f0f;
            --bg-sidebar: #1a1a2e;
            --bg-card: #1a1a2e;
            --bg-input: #12121f;
            --bg-hover: rgba(255,255,255,0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b7280;
            --border: rgba(255,255,255,0.06);
            --shadow: none;
        }
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-hover: rgba(0,0,0,0.04);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            width: 220px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            transition: background 0.25s, border-color 0.25s;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
        }
        .sidebar-link:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-link.active { background: rgba(99,102,241,0.15); color: #818cf8; }
        .sidebar-link i { width: 18px; }

        /* ─── Main Content ─── */
        .main-content {
            margin-left: 220px;
            height: 100vh;
            padding: 20px 28px;
            overflow-y: auto;
            background: var(--bg-body);
            transition: background 0.25s;
        }

        /* ─── Cards ─── */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
            box-shadow: var(--shadow);
        }
        [data-theme="dark"] .stat-card { background: #1e1e32; }
        [data-theme="light"] .stat-card { background: #ffffff; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
            box-shadow: var(--shadow);
        }
        [data-theme="dark"] .card { background: #1a1a2e; }
        [data-theme="light"] .card { background: #ffffff; }

        .card-dark {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            transition: background 0.25s, border-color 0.25s;
        }
        [data-theme="dark"] .card-dark { background: #12121f; }
        [data-theme="light"] .card-dark { background: #f8fafc; }

        /* ─── Inputs ─── */
        input, select, textarea {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
        }
        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        /* ─── Buttons ─── */
        .btn-primary {
            background: #6366f1;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .btn-primary:hover { background: #4f46e5; }

        .theme-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            justify-content: center;
            transition: 0.2s;
        }
        .theme-btn:hover { background: var(--border); color: var(--text-primary); }

        /* ─── Text Utilities ─── */
        .text-muted { color: var(--text-muted); }
        .text-secondary { color: var(--text-secondary); }
        .border-custom { border-color: var(--border); }

        /* ─── Sidebar Overlay ─── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 40;
        }
        .sidebar-overlay.active { display: block; }

        /* ─── Mobile ─── */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="px-4 py-4 border-b border-[var(--border)]">
            <a href="{% url 'home' %}" class="flex items-center gap-2">
                <span class="text-xl">💪</span>
                <span class="text-sm font-bold text-[var(--text-primary)]">Fitness<span class="text-indigo-400">Tracker</span></span>
            </a>
        </div>

        <nav class="px-3 py-2 space-y-0.5 flex-1">
            <a href="{% url 'home' %}" class="sidebar-link active"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="{% url 'workout_create' %}" class="sidebar-link"><i class="fas fa-dumbbell"></i> Log Workout</a>
            <a href="{% url 'draft_list' %}" class="sidebar-link"><i class="fas fa-pen"></i> Drafts</a>
            <a href="{% url 'workout_history' %}" class="sidebar-link">
            <i class="fas fa-history"></i> History
            </a>
            <a href="{% url 'profile' %}" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
        </nav>

        <div class="px-4 py-3 border-t border-[var(--border)] space-y-3">
            <button id="themeBtn" class="theme-btn">
                <i id="themeIcon" class="fas fa-moon"></i>
                <span id="themeLabel">Dark</span>
            </button>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold text-xs">
                        {{ user.username|first|upper }}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-[var(--text-primary)]">{{ user.username }}</p>
                        <p class="text-[10px] text-[var(--text-secondary)]">{{ user.email }}</p>
                    </div>
                </div>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="text-[var(--text-secondary)] hover:text-red-400 transition">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content">
        <div class="md:hidden flex items-center justify-between mb-4">
            <button onclick="toggleSidebar()" class="text-[var(--text-primary)] text-xl"><i class="fas fa-bars"></i></button>
            <span class="text-[var(--text-primary)] font-bold text-sm">FitnessTracker</span>
            <div></div>
        </div>

        {% if messages %}
            <div class="space-y-2 mb-4">
                {% for message in messages %}
                    <div class="flex items-center p-2 rounded-lg border-l-4 text-sm
                        {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border-emerald-500
                        {% elif message.tags == 'error' %}bg-red-500/10 text-red-400 border-red-500
                        {% elif message.tags == 'warning' %}bg-amber-500/10 text-amber-400 border-amber-500
                        {% else %}bg-blue-500/10 text-blue-400 border-blue-500{% endif %}">
                        <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-circle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} mr-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script>
        // ─── THEME ───
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';

            fetch('/set-theme/', {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                body: 'theme=' + theme
            });
        }

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        const saved = localStorage.getItem('theme') || '{{ request.session.theme|default:"dark" }}';
        setTheme(saved);

        // ─── SIDEBAR ───
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
