{% extends 'base.html' %}

{% block title %}Delete Draft - Fitness Tracker{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12">

    <div class="card text-center py-12">
        <div class="text-5xl mb-4">🗑️</div>
        <h2 class="text-xl font-bold text-[var(--text-primary)]">Delete Draft?</h2>
        <p class="text-sm text-[var(--text-secondary)] mt-2">
            Are you sure you want to delete "<strong class="text-[var(--text-primary)]">{{ workout.name }}</strong>"?
        </p>
        <p class="text-xs text-[var(--text-muted)] mt-1">
            This action cannot be undone.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 mt-6 justify-center">
            <a href="{% url 'draft_list' %}" 
               class="px-6 py-3 text-sm text-[var(--text-secondary)] hover:text-[var(--text-primary)] border border-[var(--border)] rounded-xl transition hover:bg-[var(--bg-hover)]">
                <i class="fas fa-times mr-1.5"></i> Cancel
            </a>
            <form method="post" class="inline">
                {% csrf_token %}
                <button type="submit" 
                        class="px-6 py-3 text-sm bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl transition shadow-lg shadow-red-500/20">
                    <i class="fas fa-trash mr-1.5"></i> Delete Forever
                </button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
