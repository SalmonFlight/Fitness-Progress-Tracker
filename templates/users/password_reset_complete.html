{% extends 'base.html' %}

{% block title %}Password Reset Complete - Fitness Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card p-8 text-center">
        <div class="text-5xl mb-4">✅</div>
        <h2 class="text-2xl font-bold text-[var(--text-primary)]">Password Reset Complete</h2>
        <p class="text-sm text-[var(--text-secondary)] mt-2">
            Your password has been successfully reset.
        </p>

        <a href="{% url 'login' %}" 
           class="inline-block mt-6 px-6 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-xl transition">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}
