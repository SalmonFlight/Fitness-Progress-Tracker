<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Fitness Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            background: #0f0f0f;
            position: relative;
            overflow: hidden;
        }
        .orb-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            top: -10%;
            left: -5%;
            border-radius: 50%;
            pointer-events: none;
        }
        .orb-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            border-radius: 50%;
            pointer-events: none;
        }
        .orb-3 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
        }
        .wave-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.05;
            background-image: 
                repeating-linear-gradient(45deg, 
                    transparent 0px, 
                    transparent 60px, 
                    #38bdf8 60px, 
                    #38bdf8 61px
                ),
                repeating-linear-gradient(-45deg, 
                    transparent 0px, 
                    transparent 60px, 
                    #818cf8 60px, 
                    #818cf8 61px
                );
        }
        .dot-pattern {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: radial-gradient(circle, #38bdf8 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 relative">
    <!-- Background Elements -->
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>
    <div class="wave-lines"></div>
    <div class="dot-pattern"></div>
    
    <div class="max-w-5xl w-full bg-[#1a1a2e] border border-white/10 rounded-2xl shadow-2xl overflow-hidden relative z-10">
        <div class="flex flex-col md:flex-row">
            
            <!-- Left Side - Branding -->
            <div class="w-full md:w-1/2 bg-gradient-to-br from-blue-600/90 to-indigo-700/90 p-12 flex flex-col justify-between min-h-[300px] md:min-h-[400px]">
                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-5xl">💪</span>
                        <h1 class="text-4xl font-bold text-white">Fitness<span class="text-blue-200">Tracker</span></h1>
                    </div>
                    <p class="text-blue-100 text-lg leading-relaxed">
                        Log in to continue tracking your fitness journey.
                    </p>
                </div>
                
                <div class="mt-8">
                    <p class="text-blue-100 text-sm mb-4">Don't have an account?</p>
                    <a href="{% url 'register' %}" 
                       class="inline-block bg-white/20 backdrop-blur-sm hover:bg-white/30 text-white font-semibold px-8 py-3 rounded-lg transition duration-200 text-center border border-white/20">
                        Sign up
                    </a>
                </div>
            </div>
            
            <!-- Right Side - Login Form -->
            <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                <h2 class="text-2xl font-bold text-white mb-2">Log in</h2>
                <p class="text-blue-200 text-sm mb-6">Welcome back! Please login to your account.</p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="id_username" class="block text-sm font-medium text-blue-200 mb-1">
                            Username
                        </label>
                        <input type="text" name="username" id="id_username" required
                               class="w-full px-4 py-3 bg-[#1a1a2e] border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-400 transition duration-200"
                               placeholder="Enter your username">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="block text-sm font-medium text-blue-200 mb-1">
                            Password
                        </label>
                        <input type="password" name="password" id="id_password" required
                               class="w-full px-4 py-3 bg-[#1a1a2e] border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-400 transition duration-200"
                               placeholder="Enter your password">
                    </div>

                    <div class="text-right mb-6">
                        <a href="{% url 'password_reset' %}" class="text-sm text-blue-300 hover:text-blue-100 transition duration-200">
                            Forgot your password?
                        </a>
                    </div>

                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-lg shadow-blue-600/20">
                        Log in
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</body>
</html>
