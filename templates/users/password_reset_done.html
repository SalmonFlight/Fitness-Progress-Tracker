{% extends 'base.html' %}

{% block title %}Check Your Email - Fitness Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card p-8 text-center">
        <div class="text-5xl mb-4">📧</div>
        <h2 class="text-2xl font-bold text-[var(--text-primary)]">Check Your Email</h2>
        <p class="text-sm text-[var(--text-secondary)] mt-2">
            We've sent you an email with a link to reset your password.
        </p>
        <p class="text-xs text-[var(--text-muted)] mt-1">
            If you don't see it, check your spam folder.
        </p>

        <a href="{% url 'login' %}" 
           class="inline-block mt-6 px-6 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-xl transition">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
